version: 2

builds:
  - id: ggg
    main: ./cmd/ggg
    binary: ggg
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/illegalstudio/ggg/internal/version.Version={{.Version}}
      - -X github.com/illegalstudio/ggg/internal/version.Commit={{.ShortCommit}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    files:
      - README.md
      - LICENSE

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

homebrew_casks:
  - repository:
      owner: illegalstudio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/illegalstudio/ggg
    description: Clone and manage git repositories from a YAML configuration file
