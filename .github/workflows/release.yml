name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Import Apple Developer certificate into a temporary Keychain
      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      # Build, sign, archive, and publish the GitHub release
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      # Notarize macOS archives, then replace them in the release
      - name: Notarize and update macOS binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          for archive in dist/ggg_*_darwin_*.zip; do
            echo "Notarizing $archive ..."
            xcrun notarytool submit "$archive" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" \
              --wait --timeout 360m
            echo "Notarized: $archive"

            # Replace the asset in the GitHub release with the notarized one
            FILENAME="$(basename "$archive")"
            echo "Replacing $FILENAME in release $TAG ..."
            gh release delete-asset "$TAG" "$FILENAME" --repo "$GITHUB_REPOSITORY" --yes
            gh release upload "$TAG" "$archive" --repo "$GITHUB_REPOSITORY"
          done

          # Update checksums
          echo "Updating checksums ..."
          CHECKSUMS="dist/ggg_${TAG#v}_checksums.txt"
          if [ -f "$CHECKSUMS" ]; then
            cd dist
            shasum -a 256 ggg_*.zip ggg_*.tar.gz > "$(basename "$CHECKSUMS")"
            cd ..
            CHECKSUMS_NAME="$(basename "$CHECKSUMS")"
            gh release delete-asset "$TAG" "$CHECKSUMS_NAME" --repo "$GITHUB_REPOSITORY" --yes
            gh release upload "$TAG" "$CHECKSUMS" --repo "$GITHUB_REPOSITORY"
          fi

      # Generate the Homebrew formula and push it to the tap repository.
      # Runs after notarization so the sha256 values match the final archives.
      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"

          sha() { shasum -a 256 "dist/$1" | awk '{print $1}'; }

          DARWIN_ARM64_SHA="$(sha "ggg_${VERSION}_darwin_arm64.zip")"
          DARWIN_AMD64_SHA="$(sha "ggg_${VERSION}_darwin_amd64.zip")"
          LINUX_ARM64_SHA="$(sha "ggg_${VERSION}_linux_arm64.tar.gz")"
          LINUX_AMD64_SHA="$(sha "ggg_${VERSION}_linux_amd64.tar.gz")"

          BASE_URL="https://github.com/illegalstudio/ggg/releases/download/${TAG}"

          TAP_DIR="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/illegalstudio/homebrew-tap.git" "$TAP_DIR"

          mkdir -p "$TAP_DIR/Formula"
          cat > "$TAP_DIR/Formula/ggg.rb" <<EOF
          class Ggg < Formula
            desc "Clone and manage git repositories from a YAML configuration file"
            homepage "https://github.com/illegalstudio/ggg"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "${BASE_URL}/ggg_${VERSION}_darwin_arm64.zip"
                sha256 "${DARWIN_ARM64_SHA}"
              end
              on_intel do
                url "${BASE_URL}/ggg_${VERSION}_darwin_amd64.zip"
                sha256 "${DARWIN_AMD64_SHA}"
              end
            end

            on_linux do
              on_arm do
                url "${BASE_URL}/ggg_${VERSION}_linux_arm64.tar.gz"
                sha256 "${LINUX_ARM64_SHA}"
              end
              on_intel do
                url "${BASE_URL}/ggg_${VERSION}_linux_amd64.tar.gz"
                sha256 "${LINUX_AMD64_SHA}"
              end
            end

            def install
              bin.install "ggg"
            end

            def caveats
              <<~EOS
                Install the bundled GGG skill for AI agents with:
                  ggg skills install
              EOS
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/ggg --version")
              assert_match "skills", shell_output("#{bin}/ggg --help")
            end
          end
          EOF

          cd "$TAP_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ggg.rb
          git commit -m "brew formula ggg ${TAG}"
          git push

      # Clean up keychain
      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
